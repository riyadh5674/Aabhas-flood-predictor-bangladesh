# Render.com Blueprint for Aabhas Flood Predictor
# Deploy: Connect this repo to Render → New → Blueprint
# The image ships with a bundled 120-day feature-store slice, so the API works
# without any secrets. HF_FEATURE_DATASET / HF_TOKEN are optional overrides for
# pointing at the full feature store on Hugging Face.

services:
  # Main API + Frontend (single service, serves both)
  - type: web
    name: aabhas-flood-predictor
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Render injects PORT itself. Do not pin it here: the Dockerfile reads
    # $PORT, so the platform can choose the port without a rebuild.
    envVars:
      # Self-contained demo features (tracked in git, copied into the image).
      - key: AABHAS_FEATURE_STORE
        value: system/data/demo/model_ready
      # Optional: use the full feature store hosted as a Hugging Face Dataset.
      - key: HF_FEATURE_DATASET
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: HF_FEATURE_REVISION
        value: main
      - key: AABHAS_PREVIEW_MODE
        value: "false"
      # Public JSON docs are useful for local work but unnecessary in
      # production; flip to true temporarily when debugging the API.
      - key: AABHAS_ENABLE_DOCS
        value: "false"
      - key: AABHAS_RATE_LIMIT_PER_MINUTE
        value: "180"
      - key: AABHAS_RATE_LIMIT_PREDICT_PER_MINUTE
        value: "60"
      # Comma-separated browser origins if the SPA is hosted separately.
      # Same-origin deployments need no value.
      - key: AABHAS_ALLOWED_ORIGINS
        sync: false
    autoDeploy: true
