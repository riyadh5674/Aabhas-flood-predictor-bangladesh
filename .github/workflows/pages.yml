name: Publish static demo to GitHub Pages

# Rebuilds the precomputed forecast snapshot and publishes the static build to the
# gh-pages branch. Requires HF_FEATURE_DATASET (and HF_TOKEN for a private dataset).
# The public demo is a static snapshot: no API process is required.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aabhas-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install API dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt

      - name: Download feature store from HF Datasets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_FEATURE_DATASET: ${{ secrets.HF_FEATURE_DATASET }}
        run: |
          set -euo pipefail
          if [ -z "${HF_FEATURE_DATASET:-}" ]; then
            echo "::error::HF_FEATURE_DATASET secret is not set"
            exit 1
          fi
          pip install "huggingface_hub[cli]"
          huggingface-cli download "$HF_FEATURE_DATASET" \
            --repo-type dataset \
            --include "data/train/date=*/data.parquet" \
            --local-dir hf-features \
            --token "$HF_TOKEN"
          mkdir -p system/data/processed/model_ready
          cp -R hf-features/data/train/. system/data/processed/model_ready/

      - name: Build forecast snapshot
        run: python system/deploy/build_static_snapshot.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: system/web/package-lock.json

      - name: Build static frontend
        working-directory: system/web
        env:
          VITE_AABHAS_STATIC_SNAPSHOT: "true"
          AABHAS_BASE: "/${{ github.event.repository.name }}/"
          AABHAS_SOURCEMAP: "false"
        run: |
          npm ci
          npm run build

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: system/web/dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
