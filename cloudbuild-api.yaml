# Cloud Build config for deploying Aabhas API to Cloud Run
# Usage: gcloud builds submit --config cloudbuild-api.yaml --project=YOUR_PROJECT_ID

steps:
  # Build the API + frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/aabhas-api', '-f', 'Dockerfile', '.']
    id: 'build-api'

  # Push the image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/aabhas-api']
    id: 'push-api'

  # Deploy to Cloud Run (staging first)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aabhas-api-staging'
      - '--image=gcr.io/$PROJECT_ID/aabhas-api'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=aabhas-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--port=7860'
      - '--set-env-vars=HF_FEATURE_DATASET=YOUR_HF_DATASET,HF_FEATURE_REVISION=main,AABHAS_PREVIEW_MODE=true,AABHAS_ENABLE_DOCS=false,AABHAS_RATE_LIMIT_PER_MINUTE=180,AABHAS_RATE_LIMIT_PREDICT_PER_MINUTE=60'
      - '--set-secrets=HF_TOKEN=hf-token:latest,AABHAS_PREVIEW_USER=preview-user:latest,AABHAS_PREVIEW_PASSWORD=preview-pass:latest'
    id: 'deploy-staging'

  # Run health check on staging
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        URL=$(gcloud run services describe aabhas-api-staging --region=asia-south1 --format='value(status.url)')
        echo "Waiting for staging deployment at $URL..."
        for i in {1..30}; do
          if curl -sf "$URL/health" | grep -q '"status":"ok"'; then
            echo "Staging health check passed!"
            exit 0
          fi
          sleep 10
        done
        echo "Staging health check failed"
        exit 1
    id: 'health-check-staging'

  # Promote to production (manual approval step in Cloud Build)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aabhas-api'
      - '--image=gcr.io/$PROJECT_ID/aabhas-api'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=aabhas-api@$PROJECT_ID.iam.gserviceaccount.com'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--port=7860'
      - '--set-env-vars=HF_FEATURE_DATASET=YOUR_HF_DATASET,HF_FEATURE_REVISION=main,AABHAS_PREVIEW_MODE=false,AABHAS_ENABLE_DOCS=false,AABHAS_RATE_LIMIT_PER_MINUTE=180,AABHAS_RATE_LIMIT_PREDICT_PER_MINUTE=60'
      - '--set-secrets=HF_TOKEN=hf-token:latest'
    id: 'deploy-production'
    waitFor: ['health-check-staging']

options:
  logging: CLOUD_LOGGING_ONLY